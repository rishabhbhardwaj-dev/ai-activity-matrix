<svg width="100%" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="220" fill="url(#bg)"/>

  <!-- Main Text -->
  <text
    x="600"
    y="85"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="46"
    font-weight="700"
    fill="#ffffff">
    Rishabh Bhardwaj
  </text>

  <!-- Subtitle -->
  <text
    x="600"
    y="125"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="21"
    fill="#cbd5e1">
    Full-Stack Developer | AI Application Developer
  </text>

  <!-- Flowing Wave -->
  <path
    fill="#334155"
    opacity="0.9"
    d="M0 165
       C150 125 280 205 430 165
       C580 125 700 205 850 165
       C1000 125 1100 180 1200 145
       L1200 220
       L0 220 Z">

    <animate
      attributeName="d"
      dur="6s"
      repeatCount="indefinite"
      values="
      M0 165 C150 125 280 205 430 165 C580 125 700 205 850 165 C1000 125 1100 180 1200 145 L1200 220 L0 220 Z;

      M0 150 C150 190 280 120 430 155 C580 195 700 120 850 155 C1000 190 1100 130 1200 160 L1200 220 L0 220 Z;

      M0 165 C150 125 280 205 430 165 C580 125 700 205 850 165 C1000 125 1100 180 1200 145 L1200 220 L0 220 Z
      "/>
  </path>

  <!-- Second Wave -->
  <path
    fill="#475569"
    opacity="0.55"
    d="M0 185
       C180 145 300 215 480 180
       C650 145 780 215 950 175
       C1080 145 1150 180 1200 165
       L1200 220
       L0 220 Z">

    <animate
      attributeName="d"
      dur="8s"
      repeatCount="indefinite"
      values="
      M0 185 C180 145 300 215 480 180 C650 145 780 215 950 175 C1080 145 1150 180 1200 165 L1200 220 L0 220 Z;

      M0 170 C180 210 300 150 480 190 C650 210 780 150 950 190 C1080 210 1150 150 1200 180 L1200 220 L0 220 Z;

      M0 185 C180 145 300 215 480 180 C650 145 780 215 950 175 C1080 145 1150 180 1200 165 L1200 220 L0 220 Z
      "/>
  </path>

</svg>
